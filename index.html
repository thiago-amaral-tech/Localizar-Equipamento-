    <!-- LEAFLET JS COM FALLBACK DUPLO AUTOMÁTICO (CLOUDFLARE + JSDELIVR) -->

    <script>

        }

    <script>
        /**
         * =====================================================================
         * CONFIGURAÇÕES DE PERFORMANCE PARA 28.859+ EQUIPAMENTOS
         * =====================================================================
         */
        const JSON_CANDIDATE_URLS = ['./equipamentos.json', './Equipamentos.json'];
        const CELL_SIZE = 0.02;           // Células espaciais (~2.2 km x 2.2 km)
        const MAX_VISIBLE_MARKERS = 450;  // Limite máximo simultâneo no DOM
        const LABEL_MIN_ZOOM = 16;        // Exibe nomes permanentes a partir do zoom 16
        const MAX_SEARCH_RESULTS = 25;    // Máximo de itens na lista suspensa

        let map = null;
        let visibleMarkersLayer = null;
        let selectedMarkerLayer = null;
        let spatialGrid = new Map();
        let validEquipamentos = [];

        let trafoDefaultIcon = null;
        let trafoSelectedIcon = null;
        let selectedEquipamento = null;

        // Camadas base (Toque duplo alterna entre Ruas e Satélite)
        let streetLayer = null;
        let satelliteLayer = null;
        let isSatellite = false;

        // Estado GPS do aparelho
        let userLat = null;
        let userLng = null;
        let userMarker = null;
        let userAccuracyCircle = null;
        let hasInitialGPSCentered = false;

        /**
         * =====================================================================
         * 1. CARREGAMENTO ASSÍNCRONO DE equipamentos.json (COM FALLBACK DE NOME)
         * =====================================================================
         */
        async function loadExternalEquipamentos() {
            const banner = document.getElementById('json-status-banner');
            const spinner = document.getElementById('json-spinner');
            const statusText = document.getElementById('json-status-text');
            const pickBtn = document.getElementById('btn-pick-json');

            banner.classList.add('visible');
            spinner.style.display = 'block';
            pickBtn.style.display = 'none';
            statusText.innerHTML = `
                <strong>Carregando equipamentos.json...</strong>
                <span>Indexando pontos da rede elétrica</span>
            `;

            for (let i = 0; i < JSON_CANDIDATE_URLS.length; i++) {
                try {
                    const response = await fetch(JSON_CANDIDATE_URLS[i], { cache: 'no-cache' });
                    if (response.ok) {
                        const data = await response.json();
                        processEquipamentosArray(data);
                        return;
                    }
                } catch (err) {
                    console.warn(`Tentativa falhou para ${JSON_CANDIDATE_URLS[i]}:`, err);
                }
            }

            // Se nenhum arquivo foi encontrado no servidor (ex.: não enviado ao GitHub ou nome diferente)
            spinner.style.display = 'none';
            pickBtn.style.display = 'inline-block';

            const isFileProtocol = window.location.protocol === 'file:';
            statusText.innerHTML = isFileProtocol
                ? `<strong>Modo local (file://) bloqueado pelo navegador</strong>
                   <span>Use um servidor HTTP ou selecione o arquivo manualmente:</span>`
                : `<strong>Arquivo equipamentos.json não encontrado no repositório</strong>
                   <span>Envie o arquivo para a raiz do GitHub ou selecione-o do celular:</span>`;
        }

        function processEquipamentosArray(rawData) {
            const banner = document.getElementById('json-status-banner');

            if (!Array.isArray(rawData)) {
                showBadge('Formato inválido: o JSON deve ser uma lista [ {...} ]', 4500);
                return;
            }

            buildIndexes(rawData);
            banner.classList.remove('visible');

            if (!hasInitialGPSCentered && userLat === null && validEquipamentos.length > 0 && map) {
                map.setView([validEquipamentos[0]._lat, validEquipamentos[0]._lng], 15);
            }

            renderVisibleEquipamentos();

            if (validEquipamentos.length > 0) {
                showBadge(`${validEquipamentos.length.toLocaleString('pt-BR')} equipamentos carregados`, 2800);
            } else {
                showBadge('Nenhum equipamento válido encontrado no JSON', 3500);
            }
        }

        function initManualJsonPicker() {
            const pickBtn = document.getElementById('btn-pick-json');
            const fileInput = document.getElementById('json-file-input');

            pickBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const banner = document.getElementById('json-status-banner');
                const spinner = document.getElementById('json-spinner');
                const statusText = document.getElementById('json-status-text');

                spinner.style.display = 'block';
                pickBtn.style.display = 'none';
                statusText.innerHTML = `
                    <strong>Processando ${escapeHTML(file.name)}...</strong>
                    <span>Aguarde alguns instantes</span>
                `;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        processEquipamentosArray(parsed);
                    } catch (parseErr) {
                        spinner.style.display = 'none';
                        pickBtn.style.display = 'inline-block';
                        banner.classList.add('visible');
                        showBadge('Erro ao ler JSON: verifique a sintaxe do arquivo', 4500);
                    }
                };
                reader.readAsText(file, 'UTF-8');
                fileInput.value = '';
            });
        }

        /**
         * =====================================================================
         * 2. INDEXAÇÃO ESPACIAL (0.02° x 0.02°) & ÍNDICE DE BUSCA EM MEMÓRIA
         * =====================================================================
         */
        function buildIndexes(items) {
            spatialGrid.clear();
            validEquipamentos = [];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (!item || typeof item !== 'object') continue;

                const lat = Number(item.latitude ?? item.lat);
                const lng = Number(item.longitude ?? item.lng ?? item.lon);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

                const eqStr = String(item.equipamento ?? item.nome ?? '').trim();
                const circStr = String(item.circuito ?? '').trim();

                item._lat = lat;
                item._lng = lng;
                item._eqStr = eqStr;
                item._circStr = circStr;
                item._eqLower = eqStr.toLowerCase();
                item._circLower = circStr.toLowerCase();

                validEquipamentos.push(item);

                const cellX = Math.floor(lng / CELL_SIZE);
                const cellY = Math.floor(lat / CELL_SIZE);
                const key = `${cellX}:${cellY}`;

                let bucket = spatialGrid.get(key);
                if (!bucket) {
                    bucket = [];
                    spatialGrid.set(key, bucket);
                }
                bucket.push(item);
            }
        }

        /**
         * =====================================================================
         * 3. ÍCONES SVG TÉCNICOS DE TRANSFORMADOR (NEON GREEN & NEON PURPLE)
         * =====================================================================
         */
        function createTransformerDivIcon(isSelected = false) {
            const size = isSelected ? 46 : 38;
            const half = size / 2;
            const ringColor = isSelected ? '#a855f7' : '#00ff66';
            const fillBg = isSelected ? '#1a0b2e' : '#0f2228';
            const tankFill = isSelected ? '#261142' : '#132a30';
            const halo = isSelected
                ? `<circle cx="21" cy="21" r="20" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-opacity="0.7"/>`
                : '';

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="${size}" height="${size}" style="filter: drop-shadow(0 3px 7px rgba(0,0,0,0.88));">
                    ${halo}
                    <circle cx="21" cy="21" r="18.5" fill="${fillBg}" stroke="${ringColor}" stroke-width="2.3"/>

                    <!-- Suporte de fixação e poste -->
                    <rect x="29" y="16" width="5" height="3" rx="0.8" fill="#94a3b8"/>
                    <rect x="29" y="25" width="5" height="3" rx="0.8" fill="#94a3b8"/>
                    <rect x="33" y="13" width="3" height="19" rx="1" fill="#64748b"/>

                    <!-- Buchas isoladoras de Alta Tensão (AT) -->
                    <line x1="14" y1="6.5" x2="14" y2="13" stroke="#e2f8ee" stroke-width="2.1" stroke-linecap="round"/>
                    <rect x="11.8" y="8" width="4.4" height="1.5" rx="0.7" fill="${ringColor}"/>
                    <rect x="11.8" y="10.4" width="4.4" height="1.5" rx="0.7" fill="${ringColor}"/>

                    <line x1="20" y1="6.5" x2="20" y2="13" stroke="#e2f8ee" stroke-width="2.1" stroke-linecap="round"/>
                    <rect x="17.8" y="8" width="4.4" height="1.5" rx="0.7" fill="${ringColor}"/>
                    <rect x="17.8" y="10.4" width="4.4" height="1.5" rx="0.7" fill="${ringColor}"/>

                    <!-- Bucha de Baixa Tensão (BT) -->
                    <line x1="25.5" y1="9" x2="25.5" y2="13" stroke="#e2f8ee" stroke-width="2" stroke-linecap="round"/>
                    <rect x="23.8" y="10.2" width="3.4" height="1.4" rx="0.6" fill="#38bdf8"/>

                    <!-- Tampa e tanque cilíndrico -->
                    <rect x="9.5" y="12.5" width="20" height="2.6" rx="1.1" fill="#cbd5e1"/>
                    <rect x="11" y="15" width="17" height="16.5" rx="2" fill="${tankFill}" stroke="${ringColor}" stroke-width="1.6"/>

                    <!-- Aletas de refrigeração -->
                    <line x1="8.2" y1="18" x2="11" y2="18" stroke="${ringColor}" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="8.2" y1="21.5" x2="11" y2="21.5" stroke="${ringColor}" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="8.2" y1="25" x2="11" y2="25" stroke="${ringColor}" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="8.2" y1="28.5" x2="11" y2="28.5" stroke="${ringColor}" stroke-width="1.8" stroke-linecap="round"/>

                    <!-- Raio elétrico -->
                    <polygon points="20.4,17.2 16.6,23.2 19.7,23.2 18.6,29.2 22.9,22.5 19.7,22.5" fill="#00ff66"/>
                </svg>
            `;

            return L.divIcon({
                html: svg,
                className: '',
                iconSize: [size, size],
                iconAnchor: [half, half]
            });
        }

        /**
         * =====================================================================
         * 4. RENDERIZAÇÃO POR ÁREA VISÍVEL (VIEWPORT CULLING)
         * =====================================================================
         */
        function renderVisibleEquipamentos() {
            if (!map || !visibleMarkersLayer) return;

            const bounds = map.getBounds().pad(0.15);
            const south = bounds.getSouth();
            const north = bounds.getNorth();
            const west = bounds.getWest();
            const east = bounds.getEast();

            const minCellX = Math.floor(west / CELL_SIZE);
            const maxCellX = Math.floor(east / CELL_SIZE);
            const minCellY = Math.floor(south / CELL_SIZE);
            const maxCellY = Math.floor(north / CELL_SIZE);

            const candidates = [];

            for (let cx = minCellX; cx <= maxCellX; cx++) {
                for (let cy = minCellY; cy <= maxCellY; cy++) {
                    const bucket = spatialGrid.get(`${cx}:${cy}`);
                    if (!bucket) continue;

                    for (let i = 0; i < bucket.length; i++) {
                        const item = bucket[i];
                        if (item === selectedEquipamento) continue;
                        if (item._lat >= south && item._lat <= north && item._lng >= west && item._lng <= east) {
                            candidates.push(item);
                        }
                    }
                }
            }

            const currentZoom = map.getZoom();
            const showLabels = currentZoom >= LABEL_MIN_ZOOM;
            const totalInView = candidates.length;

            let itemsToRender = candidates;
            if (totalInView > MAX_VISIBLE_MARKERS) {
                const step = Math.ceil(totalInView / MAX_VISIBLE_MARKERS);
                itemsToRender = [];
                for (let i = 0; i < totalInView && itemsToRender.length < MAX_VISIBLE_MARKERS; i += step) {
                    itemsToRender.push(candidates[i]);
                }
                showBadge(`Aproxime o zoom para ver todos os ${totalInView.toLocaleString('pt-BR')} itens na região`);
            } else {
                hideBadge();
            }

            visibleMarkersLayer.clearLayers();

            for (let i = 0; i < itemsToRender.length; i++) {
                const eq = itemsToRender[i];
                const marker = L.marker([eq._lat, eq._lng], { icon: trafoDefaultIcon });

                if (showLabels && eq._eqStr) {
                    marker.bindTooltip(escapeHTML(eq._eqStr), {
                        permanent: true,
                        direction: 'top',
                        offset: [0, -20],
                        className: 'trafo-pill-label'
                    });
                }

                marker.on('click', () => selectAndFocusEquipamento(eq, false));
                marker.addTo(visibleMarkersLayer);
            }
        }

        /**
         * =====================================================================
         * 5. SELEÇÃO DE EQUIPAMENTO & CARTÃO INFERIOR COM GOOGLE MAPS
         * =====================================================================
         */
        function selectAndFocusEquipamento(eq, shouldFly = true) {
            if (!eq || !map) return;

            selectedEquipamento = eq;
            selectedMarkerLayer.clearLayers();

            const marker = L.marker([eq._lat, eq._lng], {
                icon: trafoSelectedIcon,
                zIndexOffset: 900
            });

            if (eq._eqStr) {
                marker.bindTooltip(escapeHTML(eq._eqStr), {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -24],
                    className: 'trafo-pill-label selected'
                });
            }

            marker.addTo(selectedMarkerLayer);
            openDetailSheet(eq);

            if (shouldFly) {
                const targetZoom = Math.max(map.getZoom(), 17);
                map.flyTo([eq._lat, eq._lng], targetZoom, {
                    animate: true,
                    duration: 0.75
                });
            }

            renderVisibleEquipamentos();
        }

        function openDetailSheet(eq) {
            const sheet = document.getElementById('detail-sheet');
            const eqTitle = document.getElementById('detail-equipamento');
            const circEl = document.getElementById('detail-circuito');
            const distPill = document.getElementById('detail-distance-pill');
            const distEl = document.getElementById('detail-distance');
            const coordsEl = document.getElementById('detail-coords');
            const gmapsLink = document.getElementById('detail-gmaps-link');
            const gpsBtn = document.getElementById('btn-my-location');
            const badge = document.getElementById('subtle-badge');

            eqTitle.textContent = eq._eqStr || 'Equipamento sem código';
            circEl.textContent = eq._circStr || 'Não informado';
            coordsEl.textContent = `${eq._lat.toFixed(6)}, ${eq._lng.toFixed(6)}`;
            gmapsLink.href = `https://www.google.com/maps/dir/?api=1&destination=${eq._lat},${eq._lng}`;

            if (userLat !== null && userLng !== null) {
                const meters = calculateDistanceMeters(userLat, userLng, eq._lat, eq._lng);
                distEl.textContent = formatDistance(meters);
                distPill.style.display = 'inline-flex';
            } else {
                distPill.style.display = 'none';
            }

            sheet.classList.add('open');
            gpsBtn.classList.add('shifted-up');
            badge.classList.add('shifted-up');
        }

        function closeDetailSheet() {
            const sheet = document.getElementById('detail-sheet');
            const gpsBtn = document.getElementById('btn-my-location');
            const badge = document.getElementById('subtle-badge');

            sheet.classList.remove('open');
            gpsBtn.classList.remove('shifted-up');
            badge.classList.remove('shifted-up');

            if (selectedEquipamento) {
                selectedEquipamento = null;
                selectedMarkerLayer.clearLayers();
                renderVisibleEquipamentos();
            }
        }

        /**
         * =====================================================================
         * 6. BUSCA INSTANTÂNEA POR EQUIPAMENTO OU CIRCUITO (28.859+ REGISTROS)
         * =====================================================================
         */
        function initSearchUI() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear-btn');
            const resultsBox = document.getElementById('search-results');
            const wrapper = document.getElementById('search-wrapper');

            let debounceTimer = null;

            const executeSearch = () => {
                const rawQuery = input.value.trim();
                clearBtn.classList.toggle('visible', rawQuery.length > 0);

                if (!rawQuery) {
                    resultsBox.classList.remove('open');
                    resultsBox.innerHTML = '';
                    return;
                }

                const q = rawQuery.toLowerCase();
                const exactMatches = [];
                const prefixMatches = [];
                const partialMatches = [];

                for (let i = 0; i < validEquipamentos.length; i++) {
                    const item = validEquipamentos[i];
                    if (item._eqLower === q) {
                        exactMatches.push(item);
                    } else if (item._eqLower.startsWith(q)) {
                        prefixMatches.push(item);
                    } else if (item._eqLower.includes(q) || item._circLower.includes(q)) {
                        partialMatches.push(item);
                    }

                    if (exactMatches.length + prefixMatches.length >= MAX_SEARCH_RESULTS * 3 && q.length >= 3) {
                        break;
                    }
                }

                let combined = exactMatches.concat(prefixMatches, partialMatches);

                if (userLat !== null && userLng !== null && combined.length > 1) {
                    const topPool = combined.slice(0, 120);
                    topPool.sort((a, b) => {
                        const dA = (a._lat - userLat) ** 2 + (a._lng - userLng) ** 2;
                        const dB = (b._lat - userLat) ** 2 + (b._lng - userLng) ** 2;
                        return dA - dB;
                    });
                    combined = topPool;
                }

                renderSearchDropdown(combined.slice(0, MAX_SEARCH_RESULTS), rawQuery);
            };

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(executeSearch, 65);
            });

            input.addEventListener('focus', () => {
                if (input.value.trim().length > 0) {
                    executeSearch();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const firstItem = resultsBox.querySelector('.result-item');
                    if (firstItem) firstItem.click();
                }
            });

            clearBtn.addEventListener('click', () => {
                input.value = '';
                clearBtn.classList.remove('visible');
                resultsBox.classList.remove('open');
                resultsBox.innerHTML = '';
                input.focus();
            });

            document.addEventListener('pointerdown', (e) => {
                if (!wrapper.contains(e.target)) {
                    resultsBox.classList.remove('open');
                }
            });
        }

        function renderSearchDropdown(results, query) {
            const resultsBox = document.getElementById('search-results');
            const input = document.getElementById('search-input');

            if (results.length === 0) {
                resultsBox.innerHTML = `<div class="search-empty">Nenhum equipamento encontrado para "<strong>${escapeHTML(query)}</strong>"</div>`;
                resultsBox.classList.add('open');
                return;
            }

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < results.length; i++) {
                const eq = results[i];
                const row = document.createElement('div');
                row.className = 'result-item';
                row.setAttribute('role', 'option');

                let distBadge = '';
                if (userLat !== null && userLng !== null) {
                    const meters = calculateDistanceMeters(userLat, userLng, eq._lat, eq._lng);
                    distBadge = `<span class="result-dist">${formatDistance(meters)}</span>`;
                }

                row.innerHTML = `
                    <div class="result-info">
                        <span class="result-code">⚡ ${escapeHTML(eq._eqStr || 'Sem código')}</span>
                        <span class="result-circuit">Circuito: ${escapeHTML(eq._circStr || 'N/I')}</span>
                    </div>
                    <div class="result-meta">
                        ${distBadge}
                        <span class="result-go">Ir para item →</span>
                    </div>
                `;

                row.addEventListener('click', () => {
                    input.value = eq._eqStr;
                    input.blur();
                    resultsBox.classList.remove('open');
                    selectAndFocusEquipamento(eq, true);
                });

                fragment.appendChild(row);
            }

            resultsBox.innerHTML = '';
            resultsBox.appendChild(fragment);
            resultsBox.classList.add('open');
        }

        /**
         * =====================================================================
         * 7. GEOLOCALIZAÇÃO IMEDIATA AO ENTRAR + RASTREAMENTO CONTÍNUO
         * =====================================================================
         */
        function updateUserPositionOnMap(latitude, longitude, accuracy, shouldCenter = false, zoomLevel = 16) {
            userLat = latitude;
            userLng = longitude;
            const latlng = [latitude, longitude];

            if (!userMarker) {
                const gpsIcon = L.divIcon({
                    className: '',
                    html: '<div class="user-gps-dot"></div>',
                    iconSize: [17, 17],
                    iconAnchor: [8.5, 8.5]
                });
                userMarker = L.marker(latlng, { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
                userAccuracyCircle = L.circle(latlng, {
                    radius: accuracy || 25,
                    color: '#2563eb',
                    fillColor: '#2563eb',
                    fillOpacity: 0.14,
                    weight: 1.2
                }).addTo(map);
            } else {
                userMarker.setLatLng(latlng);
                userAccuracyCircle.setLatLng(latlng);
                if (accuracy) userAccuracyCircle.setRadius(accuracy);
            }

            if (selectedEquipamento) {
                const meters = calculateDistanceMeters(userLat, userLng, selectedEquipamento._lat, selectedEquipamento._lng);
                document.getElementById('detail-distance').textContent = formatDistance(meters);
                document.getElementById('detail-distance-pill').style.display = 'inline-flex';
            }

            if (shouldCenter) {
                hasInitialGPSCentered = true;
                map.setView(latlng, zoomLevel, { animate: true });
            }
        }

        function initGeolocation() {
            const btnLocation = document.getElementById('btn-my-location');

            btnLocation.addEventListener('click', () => {
                if (userLat !== null && userLng !== null) {
                    map.flyTo([userLat, userLng], 17, { animate: true, duration: 0.65 });
                    showBadge('Centralizado na sua localização atual', 2000);
                } else {
                    requestImmediatePosition(true);
                }
            });

            if (!('geolocation' in navigator)) {
                showBadge('GPS não suportado neste navegador', 3500);
                return;
            }

            requestImmediatePosition(true);

            navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    const needsFirstCenter = !hasInitialGPSCentered;
                    updateUserPositionOnMap(latitude, longitude, accuracy, needsFirstCenter, 16);
                },
                () => {},
                {
                    enableHighAccuracy: true,
                    maximumAge: 4000,
                    timeout: 15000
                }
            );
        }

        function requestImmediatePosition(centerOnSuccess) {
            const btnLocation = document.getElementById('btn-my-location');
            if (!('geolocation' in navigator)) return;

            btnLocation.classList.add('locating');

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    btnLocation.classList.remove('locating');
                    const { latitude, longitude, accuracy } = pos.coords;
                    updateUserPositionOnMap(latitude, longitude, accuracy, centerOnSuccess, 16);
                },
                (err) => {
                    btnLocation.classList.remove('locating');
                    if (err && err.code === 1) {
                        showBadge('Permissão de GPS negada — exibindo mapa padrão', 3600);
                    } else {
                        showBadge('Não foi possível obter o GPS agora', 3000);
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        /**
         * =====================================================================
         * 8. INICIALIZAÇÃO DO MAPA & CORREÇÃO DE TAMANHO NO MOBILE
         * =====================================================================
         */
        function initApp() {
            if (typeof L === 'undefined') {
                showBadge('Erro ao carregar motor do mapa (Leaflet). Verifique sua internet.', 6000);
                return;
            }

            trafoDefaultIcon = createTransformerDivIcon(false);
            trafoSelectedIcon = createTransformerDivIcon(true);

            const mapEl = document.getElementById('map');

            map = L.map(mapEl, {
                zoomControl: false,
                attributionControl: false,
                doubleClickZoom: false
            }).setView([-23.5505, -46.6333], 14);

            // Camada de Ruas (OpenStreetMap) com detecção de erro de rede
            streetLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            // Camada de Satélite (Esri World Imagery)
            satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19
            });

            visibleMarkersLayer = L.layerGroup().addTo(map);
            selectedMarkerLayer = L.layerGroup().addTo(map);

            // Toque duplo alterna entre Ruas e Satélite
            map.on('dblclick', () => {
                if (isSatellite) {
                    map.removeLayer(satelliteLayer);
                    streetLayer.addTo(map);
                    isSatellite = false;
                    showBadge('Mapa: Ruas', 1800);
                } else {
                    map.removeLayer(streetLayer);
                    satelliteLayer.addTo(map);
                    isSatellite = true;
                    showBadge('Mapa: Satélite', 1800);
                }
            });

            // Re-renderiza apenas os marcadores visíveis ao mover ou dar zoom
            let renderTimer = null;
            const scheduleRender = () => {
                clearTimeout(renderTimer);
                renderTimer = setTimeout(renderVisibleEquipamentos, 40);
            };

            map.on('moveend', scheduleRender);
            map.on('zoomend', scheduleRender);

            document.getElementById('detail-close').addEventListener('click', closeDetailSheet);

            // Força recálculo de dimensões do mapa em múltiplas etapas para o Chrome Mobile
            const forceMapResize = () => {
                if (map) map.invalidateSize(true);
            };

            forceMapResize();
            requestAnimationFrame(forceMapResize);
            setTimeout(forceMapResize, 120);
            setTimeout(forceMapResize, 450);
            setTimeout(forceMapResize, 1000);

            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(forceMapResize).observe(mapEl);
            }

            window.addEventListener('resize', forceMapResize);
            window.addEventListener('orientationchange', () => setTimeout(forceMapResize, 250));

            initSearchUI();
            initManualJsonPicker();
            initGeolocation();
            loadExternalEquipamentos();
        }

        /**
         * =====================================================================
         * 9. UTILITÁRIOS (DISTÂNCIA HAVERSINE, TOAST E ESCAPE HTML)
         * =====================================================================
         */
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const toRad = (deg) => deg * (Math.PI / 180);
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function formatDistance(meters) {
            if (meters < 1000) {
                return `${Math.round(meters)} m`;
            }
            return `${(meters / 1000).toFixed(1).replace('.', ',')} km`;
        }

        let badgeTimer = null;
        function showBadge(text, autoHideMs = 0) {
            const el = document.getElementById('subtle-badge');
            el.textContent = text;
            el.classList.add('visible');
            clearTimeout(badgeTimer);
            if (autoHideMs > 0) {
                badgeTimer = setTimeout(() => {
                    el.classList.remove('visible');
                }, autoHideMs);
            }
        }

        function hideBadge() {
            const el = document.getElementById('subtle-badge');
            el.classList.remove('visible');
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
